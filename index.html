<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENIUS AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080814;
            color: white;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            background: #111126;
            border-bottom: 1px solid #29294a;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #00e5ff;
            font-size: 25px;
        }

        header p {
            margin: 7px 0 0;
            color: #aaaac5;
            font-size: 13px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 15px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .bot {
            align-self: flex-start;
            background: #1b1b35;
            border: 1px solid #303057;
        }

        .user {
            align-self: flex-end;
            background: #00bcd4;
            color: #050510;
        }

        .status {
            align-self: flex-start;
            color: #aaaac5;
            font-size: 13px;
            padding: 5px 12px;
        }

        form {
            display: flex;
            gap: 9px;
            padding: 12px;
            background: #111126;
            border-top: 1px solid #29294a;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #36365b;
            border-radius: 12px;
            outline: none;
            background: #080814;
            color: white;
            font-size: 16px;
        }

        input:focus {
            border-color: #00e5ff;
        }

        button {
            padding: 0 18px;
            border: none;
            border-radius: 12px;
            background: #00e5ff;
            color: #080814;
            font-weight: bold;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.5;
        }

        button:active {
            transform: scale(0.96);
        }

        .note {
            padding: 0 12px 8px;
            background: #111126;
            color: #9292ae;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <header>
        <h1>🔥 GENIUS AI</h1>
        <p>Your ideas. Your intelligence. Your future.</p>
    </header>

    <main id="chat" aria-live="polite">
        <div class="message bot">
            Hello, Genius! 👋

            Welcome to GENIUS AI.

            I'm connected to my AI brain. Ask me anything!
        </div>
    </main>

    <form id="chatForm">
        <input
            id="userInput"
            type="text"
            placeholder="Message GENIUS AI..."
            autocomplete="off"
            aria-label="Your message"
            required
        >
        <button id="sendButton" type="submit">Send</button>
    </form>

    <div class="note">
        GENIUS AI • Powered by Gemini
    </div>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("chatForm");
        const input = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, sender) {
            const message = document.createElement("div");
            message.className = "message " + sender;
            message.textContent = text;

            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;

            return message;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const text = input.value.trim();

            if (!text) return;

            addMessage(text, "user");
            input.value = "";
            input.disabled = true;
            sendButton.disabled = true;

            const loading = addMessage(
                "GENIUS AI is thinking... 🤔",
                "status"
            );

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "The AI request failed."
                    );
                }

                addMessage(data.reply, "bot");

            } catch (error) {
                addMessage(
                    "Sorry, bro! I couldn't get a response. " +
                    error.message +
                    "\nPlease check that the GENIUS AI server is running.",
                    "bot"
                );
            } finally {
                loading.remove();
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
